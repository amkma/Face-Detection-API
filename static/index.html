<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clear Face Detection</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1.25rem 3rem;
      line-height: 1.5;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.5rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.5rem;
      background: var(--card);
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    input[type="file"] {
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .media-container {
      position: relative;
      margin-bottom: 1.5rem;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 280px;
    }
    video, img.preview {
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      display: block;
    }
    .placeholder {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 2rem;
    }
    /* Status banner */
    .status-banner {
      padding: 1.2rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .status-banner.passed {
      background: var(--success-bg);
      border: 1px solid var(--success);
      color: #34d399;
    }
    .status-banner.failed {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: #f87171;
    }
    .status-title { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    .status-desc { font-size: 0.9rem; font-weight: 400; opacity: 0.95; }
    /* Grid checks */
    .checks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .check-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .check-card .label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .check-card .value { font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; gap: 0.4rem; }
    .check-card .detail { font-size: 0.8rem; color: var(--muted); }
    .badge-ok { color: var(--success); }
    .badge-bad { color: var(--danger); }
    /* Issues list */
    .issues-card {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      border-radius: 10px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
    }
    .issues-card h3 { font-size: 0.95rem; color: #f87171; margin-bottom: 0.5rem; }
    .issues-card ul { padding-left: 1.2rem; color: #fca5a5; font-size: 0.9rem; }
    .issues-card li { margin-bottom: 0.25rem; }
    /* Raw JSON toggle */
    details {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
    }
    summary { cursor: pointer; color: var(--muted); font-weight: 600; padding: 0.25rem 0; }
    pre {
      margin-top: 0.5rem;
      background: #090d16;
      padding: 0.75rem;
      border-radius: 6px;
      overflow: auto;
      font-family: monospace;
      color: #e2e8f0;
      max-height: 250px;
    }
      #overlay { display: none; margin-top: 10px; }
    #boxCanvas { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 2; }
    #boxStage { position: relative; display: inline-block; line-height: 0; align-self: flex-start; }
    #boxStage .preview { display: block; }
    #boxLegend { font-size: 12px; opacity: .78; margin-top: 6px; text-align: center; }
  </style>
</head>
<body>
  <h1>Clear Face Detection</h1>
  <p class="subtitle">Passes only when exactly one clear, uncovered face is detected with both eyes open. Blurry, covered, too small, dark, or overexposed faces are rejected.</p>

  <div class="controls">
    <input type="file" id="file" accept="image/*" capture="user" />
    <button type="button" id="btnFile">Check image</button>
    <button type="button" id="btnCam">Use webcam</button>
  </div>

  <div class="media-container">
    <div id="placeholder" class="placeholder">Select an image or launch the webcam to test</div>
    <video id="video" autoplay playsinline muted style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div id="boxStage" style="display:none;">
      <img id="preview" class="preview" alt="Preview" />
      <canvas id="boxCanvas"></canvas>
    </div>
  </div>
  <div id="boxLegend"></div>

  <div id="resultsArea" style="display:none;">
    <div id="statusBanner" class="status-banner"></div>
    <div id="issuesCard" class="issues-card" style="display:none;"></div>
    <div class="checks-grid" id="checksGrid"></div>
  </div>

  <details id="rawDetails" style="display:none;">
    <summary>Inspect raw JSON response</summary>
    <pre id="out"></pre>
  </details>

  <script>
    const fileInput = document.getElementById("file");
    const preview = document.getElementById("preview");
    const placeholder = document.getElementById("placeholder");
    const out = document.getElementById("out");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const resultsArea = document.getElementById("resultsArea");
    const statusBanner = document.getElementById("statusBanner");
    const issuesCard = document.getElementById("issuesCard");
    const checksGrid = document.getElementById("checksGrid");
    const rawDetails = document.getElementById("rawDetails");
    const btnFile = document.getElementById("btnFile");
    const btnCam = document.getElementById("btnCam");
    const boxStage = document.getElementById("boxStage");
    // The API answers with the numbers it measured. This page draws them on the
    // picture and nowhere else: a copy of the image in the JSON would double
    // every response and be stale the moment the verdict changed.
    function base64Of(dataUrl) {
      var comma = dataUrl.indexOf(",");
      return comma === -1 ? dataUrl : dataUrl.slice(comma + 1);
    }

    function removeDataUrl(dataUrl) {
      if (dataUrl && dataUrl.slice(0, 5) === "blob:") {
        URL.revokeObjectURL(dataUrl);
      }
    }

    function showImage(dataUrl) {
      removeDataUrl(preview.src);
      preview.src = dataUrl;
      preview.style.display = "block";
      boxStage.style.display = "block";
      boxLegend.style.display = "block";
      placeholder.style.display = "none";
      window.FaceBoxOverlay.clear();
    }

    function setLoading(isLoading) {
      btnFile.disabled = isLoading;
      btnCam.disabled = isLoading;
      if (isLoading) {
        resultsArea.style.display = "block";
        statusBanner.className = "status-banner";
        statusBanner.style.background = "var(--card)";
        statusBanner.style.border = "1px solid var(--border)";
        statusBanner.style.color = "var(--text)";
        statusBanner.innerHTML = '<div class="status-title">⏳ Detecting face and checking clarity…</div>';
        issuesCard.style.display = "none";
        checksGrid.innerHTML = "";
        rawDetails.style.display = "none";
      }
    }

    // The API takes one JSON field, "image", holding base64 bytes. It does not
    // accept multipart uploads: sending FormData returns 400 with an empty
    // result object, and rendering that as "no face" blames the photo for a
    // broken request.
    function blobToBase64(blob) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          var result = String(reader.result);
          var comma = result.indexOf(",");
          resolve(comma === -1 ? result : result.slice(comma + 1));
        };
        reader.onerror = function () {
          reject(reader.error || new Error("Could not read the file."));
        };
        reader.readAsDataURL(blob);
      });
    }

    async function verify(blob, dataUrl, quality) {
      setLoading(true);
      try {
        showImage(dataUrl || URL.createObjectURL(blob));
        var image = await blobToBase64(blob);
        var res = await fetch("/api/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: image }),
        });
        var data = await res.json().catch(function () {
          return {};
        });
        if (!res.ok) {
          renderError(data.flaws || ("HTTP " + res.status + " from /api/verify"));
          return;
        }
        if (!("face_detected" in data) || !data.quality) {
          renderError("Unexpected response from /api/verify. Check that the server is running this project.");
          return;
        }
        renderResults(data);
      } catch (err) {
        renderError("Request failed: " + err.message);
      } finally {
        btnFile.disabled = false;
        btnCam.disabled = false;
      }
    }


    function renderError(msg) {
      resultsArea.style.display = "block";
      statusBanner.className = "status-banner failed";
      statusBanner.innerHTML = `
        <div class="status-title">\u274c Request error</div>
        <div class="status-desc">${msg}</div>
      `;
      issuesCard.style.display = "none";
      checksGrid.innerHTML = "";
      rawDetails.style.display = "none";
    }

    function renderResults(data) {
      resultsArea.style.display = "block";
      rawDetails.style.display = "block";
      out.textContent = JSON.stringify(data, null, 2);

      if (data.error) {
        renderError(data.error);
        return;
      }

      // The contract publishes `accepted`, not `acceptable_for_enrollment`.
      // Reading a key the API never sends left this permanently false, so a
      // passing photo rendered as "Rejected" with every card green.
      const passed = data.accepted === true;
      const q = data.quality || {};
      if (window.FaceBoxOverlay) { window.FaceBoxOverlay.draw(data); }

      // Status banner
      statusBanner.style.background = "";
      statusBanner.style.border = "";
      statusBanner.className = "status-banner " + (passed ? "passed" : "failed");
      statusBanner.innerHTML = `
        <div class="status-title">
          ${passed ? "✔️ Passed — Clear Face Detected" : "❌ Rejected — Face Not Clear"}
        </div>
        <div class="status-desc">${data.message || (passed ? "One clear face detected." : "No clear face detected.")}</div>
      `;

      // Issues card
      const issues = q.issues || [];
      if (issues.length > 0) {
        issuesCard.style.display = "block";
        issuesCard.innerHTML = `
          <h3>Issues to resolve (${issues.length}):</h3>
          <ul>${issues.map(it => `<li>${it}</li>`).join("")}</ul>
        `;
      } else {
        issuesCard.style.display = "none";
      }

      // Individual checklist cards
      const faceDetected = Boolean(data.face_detected);
      const checks = data.checks || [];
      const failedNames = (data.failed_checks || []).join(", ");
      const statusOf = (name) => {
        const row = checks.find((c) => c.name === name);
        return row ? (row.passed ? "ok" : "bad") : "unknown";
      };
      const fullFaceVisible = failedNames.length === 0;
      const eyesOpen = statusOf("landmarks_inside") === "ok";
      const visibilityDetail = !faceDetected
        ? "Not evaluated \u2014 no face was detected"
        : (fullFaceVisible ? "All checks passed" : "Failed: " + failedNames);
      const eyeDetail = !faceDetected
        ? "Can\u2019t check \u2014 no face was detected"
        : (eyesOpen ? "Both landmarks inside the box" : "landmarks_inside: " + statusOf("landmarks_inside"));
      const sharpOk = q.blur_variance != null && q.blur_variance >= 50;
      const sharpDetail = q.blur_variance == null
        ? "Can\u2019t tell \u2014 no face was detected, so sharpness was not measured"
        : "Variance: " + q.blur_variance + " (need \u2265 50)";
      const brightOk = q.brightness != null && q.brightness >= 35 && q.brightness <= 225;
      const brightDetail = q.brightness == null
        ? "Can\u2019t tell \u2014 no face was detected, so brightness was not measured"
        : "Brightness: " + q.brightness + "/255 (need 35\u2013225)";

      checksGrid.innerHTML = `
        <div class="check-card">
          <span class="label">Face Detection</span>
          <span class="value ${faceDetected && data.face_count === 1 ? "badge-ok" : "badge-bad"}">
            ${faceDetected ? (data.face_count === 1 ? "✔️ 1 Face Detected" : `❌ ${data.face_count} Faces`) : "❌ No Face"}
          </span>
          <span class="detail">YuNet score: ${data.detection_confidence ? (data.detection_confidence * 100).toFixed(0) + "%" : "N/A"}</span>
        </div>

        <div class="check-card">
          <span class="label">Face Visibility</span>
          <span class="value ${fullFaceVisible ? "badge-ok" : "badge-bad"}">
            ${fullFaceVisible ? "✔️ Full Face Visible" : "❌ Face Partly Covered"}
          </span>
          <span class="detail">${visibilityDetail}</span>
        </div>

        <div class="check-card">
          <span class="label">Eye State</span>
          <span class="value ${eyesOpen ? "badge-ok" : (faceDetected ? "badge-bad" : "")}">
            ${eyesOpen ? "\u2714\ufe0f Both Eyes Open" : (faceDetected ? "\u274c Keep Both Eyes Open" : "\u2014 Not evaluated")}
          </span>
          <span class="detail">${eyeDetail}</span>
        </div>

        <div class="check-card">
          <span class="label">Image Sharpness</span>
          <span class="value ${sharpOk ? "badge-ok" : (q.blur_variance == null ? "" : "badge-bad")}">
            ${sharpOk ? "\u2714\ufe0f Sharp" : (q.blur_variance == null ? "\u2014 Not measured" : "\u274c Blurry")}
          </span>
          <span class="detail">${sharpDetail}</span>
        </div>

        <div class="check-card">
          <span class="label">Lighting</span>
          <span class="value ${brightOk ? "badge-ok" : (q.brightness == null ? "" : "badge-bad")}">
            ${brightOk ? "\u2714\ufe0f Well Lit" : (q.brightness == null ? "\u2014 Not measured" : "\u274c Poor Lighting")}
          </span>
          <span class="detail">${brightDetail}</span>
        </div>
      `;
    }

    fileInput.onchange = async () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) { return; }
      video.style.display = "none";
      // A chosen file IS the intent to check it. Requiring a second click on
      // "Check image" left the input populated but nothing sent, which looks
      // exactly like a broken detector: every card renders blank.
      await verify(f);
    };

    btnFile.onclick = async () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) {
        renderError("Choose an image first. On a phone, \"Check image\" opens the camera, so a picture taken in another app or a screenshot is off the menu.");
        return;
      }
      video.style.display = "none";
      await verify(f);
    };

    // Cameras up to 4K only work after permission is granted; check while the
    // picker is still the right place to choose one.
    async function cameraSize() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { return null; }
      var stream = null;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        var track = stream.getVideoTracks()[0];
        if (!track) { return null; }
        var settings = track.getSettings();
        var label = track.label || "camera";
        var w = settings.width || 0;
        var h = settings.height || 0;
        if (!w) {
          var tmp = document.createElement("video");
          tmp.muted = true;
          tmp.srcObject = stream;
          await tmp.play();
          w = tmp.videoWidth;
          h = tmp.videoHeight;
        }
        return label + " \u00b7 " + w + "\u00d7" + h;
      } catch (e) {
        return "Camera not available (" + messageOf(e) + ")";
      } finally {
        if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); }
      }
    }

    function pickFrame(video, canvas, warmed) {
      // Reuse the canvas that was already shown. Setting width/height clears it in
      // every browser, so the picture blinks to black unless it is set before draw.
      var w = video.videoWidth;
      var h = video.videoHeight;
      if (!w || !h) {
        throw new Error("The camera has not produced a frame yet.");
      }
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, w, h);
      // A stream that opens before the sensor warms up can deliver an all-black
      // frame. That frame passes to the detector as "no face", and the user reads
      // it as a rejection of their face. Measure a sample downscaled with
      // smoothing on; the sensor noise always averages well away from 0.
      var small = document.createElement("canvas");
      small.width = 64;
      small.height = 64;
      small.getContext("2d").drawImage(video, 0, 0, 64, 64);
      var px = small.getContext("2d").getImageData(0, 0, 64, 64).data;
      var sum = 0;
      for (var i = 0; i < px.length; i += 4) {
        sum += px[i] + px[i + 1] + px[i + 2];
      }
      var mean = sum / (px.length / 4) / 3;
      if (warmed.ink || mean > 6) {
        warmed.ink = true;
        warmed.mean = mean;
        return Promise.resolve({ dataUrl: canvas.toDataURL("image/jpeg", 0.95), w: w, h: h });
      }
      return new Promise(function (resolve) { setTimeout(resolve, 120); })
        .then(function () { return pickFrame(video, canvas, warmed); });
    }

    function messageOf(err) {
      if (!err) { return "unknown error"; }
      if (err.name && err.name !== "Error") { return err.name; }
      return err.message || String(err);
    }

    (async function () {
      var text = await cameraSize();
      if (text) { fileInput.title = "Camera: " + text; }
    })();

    // Live camera: one stream, a frame posted every CAM_POLL_MS.
    // The old flow opened a stream per click and closed it before the result
    // arrived. A poll reuses the open stream and only serialises overlapping
    // requests, so a mouse-click burst cannot stack token requests on the sensor.
    var CAM_POLL_MS = 900;
    var camStream = null;
    var camTimer = 0;
    var camBusy = false;
    var camWarm = {};
    var lastDataUrl = "";

    function stopCam() {
      if (camTimer) { clearTimeout(camTimer); }
      camTimer = 0;
      if (camStream) { camStream.getTracks().forEach(function (t) { t.stop(); }); }
      camStream = null;
      video.pause();
      video.srcObject = null;
      video.style.display = "none";
      btnCam.textContent = "Use webcam";
    }

    async function frameOf(video, canvas) {
      var w = video.videoWidth;
      var h = video.videoHeight;
      if (!w || !h) {
        throw new Error("The camera has not produced a frame yet.");
      }
      var small = document.createElement("canvas");
      small.width = 48;
      small.height = 48;
      small.getContext("2d").drawImage(video, 0, 0, 48, 48);
      var px = small.getContext("2d").getImageData(0, 0, 48, 48).data;
      var sum = 0;
      for (var i = 0; i < px.length; i += 4) {
        sum += px[i] + px[i + 1] + px[i + 2];
      }
      var mean = sum / (px.length / 4) / 3;
      if (!camWarm.ink && mean <= 6) { return null; }

      var side = 1280;
      var big = Math.max(w, h);
      if (big < side) { side = big; }
      canvas.width = Math.round(w * side / big);
      canvas.height = Math.round(h * side / big);
      var ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      camWarm.ink = true;
      return canvas.toDataURL("image/jpeg", 0.95);
    }

    async function sendFrame() {
      var dataUrl = null;
      try {
        dataUrl = await frameOf(video, canvas);
      } finally {
        camBusy = false;
      }
      if (!dataUrl || dataUrl === lastDataUrl) { return; }
      lastDataUrl = dataUrl;
      await verify({ camera: true }, dataUrl);
    }

    function pollTick() {
      if (!camStream) { return; }
      if (!camBusy) {
        camBusy = true;
        sendFrame()
          .catch(function () { camBusy = false; })
          .finally(function () { camBusy = false; });
      }
      camTimer = setTimeout(pollTick, CAM_POLL_MS);
    }

    btnCam.onclick = async () => {
      if (camStream) {
        stopCam();
        showImage(lastDataUrl);
        return;
      }
      try {
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = camStream;
        video.style.display = "block";
        canvas.style.display = "none";
        placeholder.textContent = "Live camera";
        btnCam.textContent = "Stop camera";
        await video.play();
        lastDataUrl = "";
        pollTick();
      } catch (e) {
        camStream = null;
        btnCam.textContent = "Use webcam";
        video.style.display = "none";
        canvas.style.display = "none";
        renderError("Webcam: " + messageOf(e));
      }
    };


    </script>
  <script src="/overlay.js"></script>
</body>
</html>
